apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-sonar
spec:
  serviceAccountName: jenkins-build-sa
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:4.10-3
      args:
        - ${computer.jnlpmac}
        - ${computer.name}
    - name: sonar
      image: sonarsource/sonar-scanner-cli:4.7.0
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
  restartPolicy: Never
